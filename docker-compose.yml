services:
  # =========================================
  # 1. PostgreSQL 数据库服务
  # -----------------------------------------
  # 作用：
  #   - 存储业务数据（用户、简历信息等）
  #   - 存储向量数据（基于 pgvector 插件），用于 RAG（检索增强生成）知识库检索
  #
  # 教程知识点：
  #   - 选用 pgvector/pgvector 镜像而不是标准的 postgres 镜像，是为了获得向量搜索能力。
  #   - 向量数据库是 LLM 应用开发中的核心基础设施。
  # =========================================
  postgres:
    # 使用带有 pgvector 插件的 PostgreSQL 16 镜像
    image: pgvector/pgvector:pg16
    container_name: interview-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: interview_guide
    volumes:
      # 数据持久化：确保容器重启或删除后，数据库数据不丢失
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本：容器首次启动时会自动执行 /docker-entrypoint-initdb.d/ 下的 .sql 文件
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    # 健康检查：
    # 后端服务(app)需要等待数据库完全启动并准备好连接后才能启动。
    # 这里通过 pg_isready 命令检测数据库状态。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================
  # 2. Redis 缓存与消息队列服务
  # -----------------------------------------
  # 作用：
  #   - 缓存：存储 Session、临时数据，提升系统性能
  #   - 消息队列：利用 Redis Stream 实现异步任务处理（如简历分析、文档向量化）
  #
  # 教程知识点：
  #   - 在轻量级架构中，Redis Stream 是 Kafka/RabbitMQ 的优秀替代方案，运维成本更低。
  # =========================================
  redis:
    image: redis:7
    container_name: interview-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================
  # 3. RustFS 对象存储服务 (S3 兼容)
  # -----------------------------------------
  # 作用：存储非结构化数据（简历/知识库文档等），S3 协议兼容，可无缝切换云厂商。
  # 端口：9000=API（代码上传/下载）、9001=控制台
  # =========================================
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: interview-rustfs
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_RPC_SECRET: ${RUSTFS_RPC_SECRET}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--silent", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================
  # 5. 后端应用服务 (Spring Boot)
  # -----------------------------------------
  # 作用：
  #   - 提供 RESTful API
  #   - 处理核心业务逻辑（简历分析、模拟面试、RAG）
  # =========================================
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: interview-app
    # 依赖管理：确保基础设施准备好后再启动后端
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      # === 数据库连接 ===
      # 使用服务名 'postgres' 作为主机名，Docker 内部 DNS 会自动解析
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: interview_guide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      
      # === Redis 连接 ===
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # === 对象存储配置 ===
      # 注意：后端在容器内访问 RustFS，使用 http://rustfs:9000
      APP_STORAGE_ENDPOINT: http://rustfs:9000
      APP_STORAGE_ACCESS_KEY: rustfsadmin
      APP_STORAGE_SECRET_KEY: rustfsadmin
      APP_STORAGE_BUCKET: interview-guide
      APP_STORAGE_REGION: us-east-1
      
      # === AI 模型配置 (必须配置) ===
      # 这里的变量值来自宿主机的环境变量或 .env 文件
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen3.7-plus}
      APP_AI_CONFIG_ENCRYPTION_KEY: ${APP_AI_CONFIG_ENCRYPTION_KEY}

      # === 面试参数配置 ===
      APP_INTERVIEW_FOLLOW_UP_COUNT: ${APP_INTERVIEW_FOLLOW_UP_COUNT:-1}
      APP_INTERVIEW_EVALUATION_BATCH_SIZE: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:-8}
    ports:
      - "8080:8080"

  # =========================================
  # 6. 前端应用服务 (Vue/React + Nginx)
  # -----------------------------------------
  # 作用：
  #   - 提供用户界面
  #   - 反向代理 API 请求（通常在 Nginx 配置中处理）
  # =========================================
  frontend:
    build: ./frontend
    container_name: interview-frontend
    depends_on:
      - app
    ports:
      - "80:80"

# =========================================
# 定义 Docker 卷 (Volumes)
# -----------------------------------------
# 作用：声明命名卷，用于数据持久化。
# 即使删除了容器 (docker-compose down)，这些卷中的数据依然存在。
# =========================================
volumes:
  postgres_data:
  redis_data:
  rustfs_data:
